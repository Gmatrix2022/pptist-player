<!DOCTYPE html>

<head>

  <title>PPTist Player Official Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0B0F19; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #viewport { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #canvas-stage { position: relative; transform-origin: center center; box-shadow: 0 25px 60px rgba(0,0,0,0.45); background: #FFFFFF; overflow: hidden; flex-shrink: 0; }
    .slide-layer { position: absolute; inset: 0; display: none; background: #FFFFFF; }
    .slide-layer.active { display: block; }
    .ast-el { position: absolute; box-sizing: border-box; }
    .ast-text { word-break: break-word; pointer-events: auto; }
    .ast-text p { margin: 0; }
    .ast-shape { pointer-events: none; }
    .ast-shape svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .ast-image { pointer-events: none; }
    .ast-image img { width: 100%; height: 100%; display: block; }
    .ast-line { pointer-events: none; overflow: visible; }
    #presenter-bar { position: absolute; bottom: 24px; right: 32px; display: flex; align-items: center; gap: 12px; background: rgba(15,23,42,0.78); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.16); border-radius: 999px; padding: 6px 16px; color: #E2E8F0; font-size: 14px; font-family: Consolas, monospace; z-index: 1000; transition: opacity 0.35s ease; }
    #presenter-bar.idle { opacity: 0.12; }
    #presenter-bar:hover { opacity: 1 !important; }
    .ctrl-btn { background: none; border: none; color: #E2E8F0; font-size: 15px; cursor: pointer; padding: 4px 8px; border-radius: 6px; outline: none; }
    .ctrl-btn:hover { background: rgba(255,255,255,0.15); color: #FFFFFF; }
  </style>
  <script>window.__PPTIST_DATA__ = {"width":1536,"height":864,"viewportRatio":0.5625,"title":"PPTist Player Official Demo","slides":[{"id":"slide_01","background":{"color":"#F8FAFC"},"elements":[{"id":"s1_pill_bg","type":"shape","left":80,"top":60,"width":320,"height":36,"viewBox":[320,36],"path":"M 18 0 H 302 Q 320 0 320 18 V 18 Q 320 36 302 36 H 18 Q 0 36 0 18 V 18 Q 0 0 18 0 Z","fill":"#EFF6FF","outline":{"color":"#3B82F6","width":1.2,"style":"solid"}},{"id":"s1_pill_txt","type":"text","left":96,"top":68,"width":288,"height":20,"content":"<p style=\"margin:0;font-family:sans-serif;font-size:13px;font-weight:700;color:#1D4ED8;letter-spacing:1px;\">PPTIST · STANDALONE RUNTIME</p>"},{"id":"s1_h1","type":"text","left":80,"top":120,"width":1376,"height":90,"content":"<p style=\"margin:0;line-height:1.15;font-family:sans-serif;font-size:52px;font-weight:900;color:#0F172A;\">PPTist Player <span style=\"color:#2563EB;\">Zero-Dependency</span> Standalone Engine</p>"},{"id":"s1_sub","type":"text","left":80,"top":210,"width":1376,"height":40,"content":"<p style=\"margin:0;font-family:sans-serif;font-size:20px;font-weight:500;color:#475569;\">1:1 Pixel-perfect AST reproduction · <8KB Vanilla JavaScript · Double-click offline presentation</p>"},{"id":"s1_card1_bg","type":"shape","left":80,"top":290,"width":432,"height":380,"viewBox":[432,380],"path":"M 20 0 H 412 Q 432 0 432 20 V 360 Q 432 380 412 380 H 20 Q 0 380 0 360 V 20 Q 0 0 20 0 Z","fill":"#FFFFFF","outline":{"color":"#E2E8F0","width":1.5,"style":"solid"}},{"id":"s1_card1_txt","type":"text","left":110,"top":320,"width":372,"height":320,"content":"<p style=\"margin:0;font-family:sans-serif;font-size:22px;font-weight:800;color:#0F172A;\">01. Zero Dependencies</p><p style=\"margin:8px 0 0;font-family:monospace;font-size:12px;color:#2563EB;\">PURE VANILLA WEB STANDARDS</p><p style=\"margin:20px 0 0;line-height:1.7;font-family:sans-serif;font-size:15px;color:#334155;\">No Vue runtime, no Pinia store, no massive npm bundles. Renders standard PPTist geometric AST directly into native SVG and physical DOM elements.</p>"},{"id":"s1_card2_bg","type":"shape","left":552,"top":290,"width":432,"height":380,"viewBox":[432,380],"path":"M 20 0 H 412 Q 432 0 432 20 V 360 Q 432 380 412 380 H 20 Q 0 380 0 360 V 20 Q 0 0 20 0 Z","fill":"#FFFFFF","outline":{"color":"#E2E8F0","width":1.5,"style":"solid"}},{"id":"s1_card2_txt","type":"text","left":582,"top":320,"width":372,"height":320,"content":"<p style=\"margin:0;font-family:sans-serif;font-size:22px;font-weight:800;color:#0F172A;\">02. Double-Click Offline</p><p style=\"margin:8px 0 0;font-family:monospace;font-size:12px;color:#16A34A;\">ZERO SERVER & USB READY</p><p style=\"margin:20px 0 0;line-height:1.7;font-family:sans-serif;font-size:15px;color:#334155;\">Self-contained data inlining completely eradicates Chromium file:/// CORS errors. Carry on a USB flash drive and double-click to present on podiums instantly.</p>"},{"id":"s1_card3_bg","type":"shape","left":1024,"top":290,"width":432,"height":380,"viewBox":[432,380],"path":"M 20 0 H 412 Q 432 0 432 20 V 360 Q 432 380 412 380 H 20 Q 0 380 0 360 V 20 Q 0 0 20 0 Z","fill":"#FFFFFF","outline":{"color":"#E2E8F0","width":1.5,"style":"solid"}},{"id":"s1_card3_txt","type":"text","left":1054,"top":320,"width":372,"height":320,"content":"<p style=\"margin:0;font-family:sans-serif;font-size:22px;font-weight:800;color:#0F172A;\">03. 1:1 Pixel Fidelity</p><p style=\"margin:8px 0 0;font-family:monospace;font-size:12px;color:#7C3AED;\">SUBPIXEL PRECISION GEOMETRY</p><p style=\"margin:20px 0 0;line-height:1.7;font-family:sans-serif;font-size:15px;color:#334155;\">Adheres strictly to the 1536x864 canvas coordinate space. Hardware-accelerated dynamic scale transforms adapt seamlessly to any projector or screen ratio.</p>"},{"id":"s1_foot_bg","type":"shape","left":80,"top":710,"width":1376,"height":80,"viewBox":[1376,80],"path":"M 16 0 H 1360 Q 1376 0 1376 16 V 64 Q 1376 80 1360 80 H 16 Q 0 80 0 64 V 16 Q 0 0 16 0 Z","fill":"#FFFFFF","outline":{"color":"#E2E8F0","width":1.2,"style":"solid"}},{"id":"s1_foot_txt","type":"text","left":110,"top":738,"width":1316,"height":30,"content":"<p style=\"margin:0;font-family:monospace;font-size:14px;color:#64748B;\">Navigation: Space / PageDown / Arrows to navigate ｜ F for Fullscreen ｜ MIT License</p>"}]},{"id":"slide_02","background":{"color":"#0B0F19"},"elements":[{"id":"s2_title","type":"text","left":80,"top":80,"width":1376,"height":60,"content":"<p style=\"margin:0;font-family:sans-serif;font-size:40px;font-weight:900;color:#F8FAFC;\">Architecture & Single Source of Truth</p>"},{"id":"s2_sub","type":"text","left":80,"top":150,"width":1376,"height":30,"content":"<p style=\"margin:0;font-family:sans-serif;font-size:18px;color:#94A3B8;\">One AST schema to power web presentation, editable PPTX compilation, and offline packs.</p>"},{"id":"s2_card1","type":"shape","left":80,"top":220,"width":660,"height":480,"viewBox":[660,480],"path":"M 16 0 H 644 Q 660 0 660 16 V 464 Q 660 480 644 480 H 16 Q 0 480 0 464 V 16 Q 0 0 16 0 Z","fill":"#1E293B","outline":{"color":"#334155","width":1.5,"style":"solid"}},{"id":"s2_card1_txt","type":"text","left":110,"top":250,"width":600,"height":420,"content":"<p style=\"margin:0;font-family:sans-serif;font-size:24px;font-weight:700;color:#38BDF8;\">Official PPTist Packaging</p><p style=\"margin:16px 0;line-height:1.8;font-family:sans-serif;font-size:15px;color:#CBD5E1;\">• Full Vue3 + Pinia + Vite SPA build (30MB ~ 50MB)<br>• Heavy ProseMirror editor, UI kits & bundle chunks<br>• Fails on file:/// protocol via Chromium CORS policy<br>• Requires local HTTP server installation on podiums</p>"},{"id":"s2_card2","type":"shape","left":796,"top":220,"width":660,"height":480,"viewBox":[660,480],"path":"M 16 0 H 644 Q 660 0 660 16 V 464 Q 660 480 644 480 H 16 Q 0 480 0 464 V 16 Q 0 0 16 0 Z","fill":"#0F172A","outline":{"color":"#2563EB","width":2,"style":"solid"}},{"id":"s2_card2_txt","type":"text","left":826,"top":250,"width":600,"height":420,"content":"<p style=\"margin:0;font-family:sans-serif;font-size:24px;font-weight:700;color:#60A5FA;\">PPTist Player (This Project)</p><p style=\"margin:16px 0;line-height:1.8;font-family:sans-serif;font-size:15px;color:#E2E8F0;\">• Zero external dependencies (<8KB standalone JS)<br>• Direct AST-to-physical-DOM geometric compilation<br>• 100% self-contained single-file offline distribution<br>• Instant 0ms boot from USB drive on any computer</p>"}]},{"id":"slide_03","background":{"color":"#F8FAFC"},"elements":[{"id":"s3_title","type":"text","left":80,"top":240,"width":1376,"height":80,"content":"<p style=\"margin:0;text-align:center;font-family:sans-serif;font-size:56px;font-weight:900;color:#0F172A;\">Ready for the Community</p>"},{"id":"s3_desc","type":"text","left":280,"top":340,"width":976,"height":100,"content":"<p style=\"margin:0;text-align:center;line-height:1.8;font-family:sans-serif;font-size:20px;color:#475569;\">Free & Open Source under MIT License.<br>Designed for AI presentation generators, education platforms, and mobile offline players.</p>"},{"id":"s3_cta","type":"shape","left":608,"top":480,"width":320,"height":56,"viewBox":[320,56],"path":"M 28 0 H 292 Q 320 0 320 28 V 28 Q 320 56 292 56 H 28 Q 0 56 0 28 V 28 Q 0 0 28 0 Z","fill":"#2563EB"},{"id":"s3_cta_txt","type":"text","left":608,"top":496,"width":320,"height":28,"content":"<p style=\"margin:0;text-align:center;font-family:sans-serif;font-size:17px;font-weight:700;color:#FFFFFF;letter-spacing:1px;\">STAR ON GITHUB</p>"}]}]};</script>
</head>
<body>
  <div id="viewport"><div id="canvas-stage"></div></div>
  <div id="presenter-bar">
    <button class="ctrl-btn" id="btn-prev">◀</button>
    <span id="page-indicator">01 / 03</span>
    <button class="ctrl-btn" id="btn-next">▶</button>
    <button class="ctrl-btn" id="btn-fs" style="margin-left:4px;">⛶</button>
  </div>
  <script>
    (function() {
      const DATA = window.__PPTIST_DATA__;
      const STAGE_W = DATA.width || 1536;
      const STAGE_H = DATA.height || 864;
      const slides = DATA.slides;
      let currentIndex = 0;
      const stage = document.getElementById('canvas-stage');
      stage.style.width = STAGE_W + 'px';
      stage.style.height = STAGE_H + 'px';
      const indicator = document.getElementById('page-indicator');
      const presenterBar = document.getElementById('presenter-bar');

      function fitStage() {
        const scale = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
        stage.style.transform = 'scale(' + scale + ')';
      }
      window.addEventListener('resize', fitStage);
      fitStage();

      function renderSlide(slide, container) {
        container.innerHTML = '';
        if (slide.background?.color) container.style.background = slide.background.color;
        for (const el of slide.elements || []) {
          const t = el.type, left = el.left || 0, top = el.top || 0, w = el.width || 0, h = el.height || 0, rot = el.rotate || 0, op = el.opacity !== undefined ? el.opacity : 1;
          if (t === 'shape') {
            const div = document.createElement('div');
            div.className = 'ast-el ast-shape';
            div.style.left = left + 'px'; div.style.top = top + 'px'; div.style.width = w + 'px'; div.style.height = h + 'px'; div.style.opacity = op;
            if (rot) div.style.transform = 'rotate(' + rot + 'deg)';
            const vb = el.viewBox || [w, h];
            const outline = el.outline || el.border;
            let stroke = '';
            if (outline) stroke = 'stroke="' + (outline.color || '#CBD5E1') + '" stroke-width="' + (outline.width || 1) + '"';
            div.innerHTML = '<svg viewBox="0 0 ' + vb[0] + ' ' + vb[1] + '" preserveAspectRatio="none"><path d="' + (el.path || '') + '" fill="' + (el.fill || 'none') + '" ' + stroke + ' /></svg>';
            container.appendChild(div);
          } else if (t === 'text') {
            const div = document.createElement('div');
            div.className = 'ast-el ast-text';
            div.style.left = left + 'px'; div.style.top = top + 'px'; div.style.width = w + 'px'; div.style.height = h + 'px'; div.style.opacity = op;
            if (rot) div.style.transform = 'rotate(' + rot + 'deg)';
            div.innerHTML = el.content || '';
            container.appendChild(div);
          } else if (t === 'image') {
            const div = document.createElement('div');
            div.className = 'ast-el ast-image';
            div.style.left = left + 'px'; div.style.top = top + 'px'; div.style.width = w + 'px'; div.style.height = h + 'px'; div.style.opacity = op;
            if (rot) div.style.transform = 'rotate(' + rot + 'deg)';
            div.innerHTML = '<img src="' + el.src + '" style="width:100%;height:100%;object-fit:' + (el.fixedRatio ? 'contain' : 'fill') + ';" />';
            container.appendChild(div);
          } else if (t === 'line') {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('class', 'ast-el ast-line');
            svg.style.left = left + 'px'; svg.style.top = top + 'px'; svg.style.width = '1px'; svg.style.height = '1px';
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', el.start ? el.start[0] : 0); line.setAttribute('y1', el.start ? el.start[1] : 0);
            line.setAttribute('x2', el.end ? el.end[0] : w); line.setAttribute('y2', el.end ? el.end[1] : 0);
            line.setAttribute('stroke', el.color || '#CBD5E1'); line.setAttribute('stroke-width', el.width || 1);
            svg.appendChild(line); container.appendChild(svg);
          }
        }
      }

      const layers = slides.map((s, idx) => {
        const l = document.createElement('div');
        l.className = 'slide-layer' + (idx === 0 ? ' active' : '');
        l.style.width = STAGE_W + 'px'; l.style.height = STAGE_H + 'px';
        stage.appendChild(l);
        return l;
      });

      const rendered = new Set();
      function show(idx) {
        if (idx < 0 || idx >= slides.length) return;
        currentIndex = idx;
        layers.forEach((l, i) => {
          if (i === idx) {
            l.classList.add('active');
            if (!rendered.has(i)) { renderSlide(slides[i], l); rendered.add(i); }
          } else { l.classList.remove('active'); }
        });
        if (idx + 1 < slides.length && !rendered.has(idx + 1)) {
          renderSlide(slides[idx + 1], layers[idx + 1]); rendered.add(idx + 1);
        }
        indicator.textContent = String(idx + 1).padStart(2, '0') + ' / ' + String(slides.length).padStart(2, '0');
      }
      show(0);

      window.addEventListener('keydown', (e) => {
        if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(e.key)) show(currentIndex + 1);
        else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) show(currentIndex - 1);
        else if (['f', 'F', 'F5'].includes(e.key)) {
          if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
          else document.exitFullscreen().catch(()=>{});
        }
      });
      document.getElementById('btn-next').onclick = () => show(currentIndex + 1);
      document.getElementById('btn-prev').onclick = () => show(currentIndex - 1);
      document.getElementById('btn-fs').onclick = () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
        else document.exitFullscreen().catch(()=>{});
      };
      let timer = null;
      window.addEventListener('mousemove', () => {
        presenterBar.classList.remove('idle');
        clearTimeout(timer);
        timer = setTimeout(() => presenterBar.classList.add('idle'), 2500);
      });
    })();
  </script>
</body>
</html>
